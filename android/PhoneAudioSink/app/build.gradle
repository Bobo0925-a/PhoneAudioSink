plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名凭据只从本机 local.properties 读取，不入库
def signingProps = new Properties()
def signingPropsFile = rootProject.file("local.properties")
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    namespace 'com.example.phoneaudiosink'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.phoneaudiosink"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (signingProps['store.file']) {
                storeFile rootProject.file(signingProps['store.file'])
                storePassword signingProps['store.password']
                keyAlias signingProps['key.alias']
                keyPassword signingProps['key.password']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingProps['store.file']) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation('com.github.ashipo:jopus:0.4.0') {
        exclude group: 'org.jetbrains.kotlin'
    }
}
